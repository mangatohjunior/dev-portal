apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-portal.fullname" . }}-portal
  labels:
    {{- include "dev-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal
type: Opaque
stringData:
  gitlab-token: {{ required "secrets.gitlabToken is required" .Values.secrets.gitlabToken | quote }}
  SESSION_SECRET_KEY: {{ .Values.secrets.sessionSecret | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ required "secrets.keycloakClientSecret is required" .Values.secrets.keycloakClientSecret | quote }}
{{- $session := required "secrets.sessionSecret is required" .Values.secrets.sessionSecret }}
{{- if lt (len $session) 16 }}
{{- fail "secrets.sessionSecret must be at least 16 characters" }}
{{- end }}
